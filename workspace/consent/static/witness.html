<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>见证者签署</title>
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div id="app"></div>
<script src="/static/app.js"></script>
<script src="/static/shared/ed25519.js"></script>
<script src="/static/shared/device-client.js"></script>
<script>
// 见证者：凭现场提供的一次性签名链接进入，不持有任何登录令牌。
// 但所用浏览器仍须是一台已可信登记、归属本站、未隔离、证书在有效期内的见证设备。
(async () => {
  const q = new URLSearchParams(location.search);
  const sessionId = q.get("session"), role = q.get("role"), token = q.get("token");
  const mount = document.getElementById("app");
  if (!sessionId || role !== "witness" || !token) {
    mount.innerHTML = '<main><div class="card"><h2>链接无效</h2><p>请向现场负责人索取一次性见证签名链接。</p></div></main>';
    return;
  }
  let s;
  try { s = await api("GET", `/api/sessions/${sessionId}`); }
  catch (e) {
    mount.innerHTML = `<main><div class="card"><h2>无法打开会话</h2><div class="err">${esc(e.message)}</div></div></main>`;
    return;
  }
  const INST = s.material.inst_id;
  const bodyDigest = s.material.body_hash;

  function registered() { return DeviceAuth.hasCert(INST, "witness"); }

  function render() {
    if (!registered()) {
      mount.innerHTML = `<main><div class="card">
        <h2>见证设备可信登记</h2>
        <p class="muted">本机浏览器尚未登记为本站见证设备。请向现场负责人索取<b>一次性见证设备注册码</b>
          （与下方签名链接是两种不同的一次性凭证）。登记后私钥仅保存在本机、不出设备。</p>
        <div class="row">
          <div style="flex:2"><label>一次性设备注册码</label><input id="wregcode"></div>
          <div><label>设备标识</label><input id="wreglabel" value="见证终端"></div>
          <div style="flex:0 0 auto"><label>&nbsp;</label><button id="wregbtn">登记本机</button></div>
        </div><div id="wregmsg"></div>
      </div></main>`;
      document.getElementById("wregbtn").onclick = async () => {
        const box = document.getElementById("wregmsg");
        const code = document.getElementById("wregcode").value.trim();
        const label = document.getElementById("wreglabel").value.trim() || "见证终端";
        if (!code) { toast(box, new Error("请粘贴设备注册码")); return; }
        try {
          await DeviceAuth.register(INST, "witness", code, label);
          render();
        } catch (e) { toast(box, e); }
      };
      return;
    }

    const info = DeviceAuth.certInfo(INST, "witness");
    mount.innerHTML = `<main>
      <div class="card">
        <h2>见证者在线签署 — ${esc(s.material.family)} v${s.material.version}</h2>
        <p class="muted">会话 ${esc(s.id)} · 状态 ${pill(s.status)} · 封存指纹
          <span class="hash">${esc(bodyDigest)}</span></p>
        <p class="muted">见证设备证书 ${esc(info.cert_id)}（第 ${info.gen} 代），本次落款将由本机私钥签署。</p>
        <details open><summary>请阅读并核对你将见证的封存告知正文</summary><pre>${esc(s.material.body)}</pre></details>
        <div class="muted">语种：${esc(s.material.language)} · 适用条件：${esc(JSON.stringify(s.material.conditions))}
          · 允许操作：${opList(s.material.scope)}</div>
        <label style="margin-top:10px">见证者姓名（将随落款一并封存）</label>
        <input id="wname" placeholder="真实姓名">
        <div style="margin-top:10px">
          <button id="wbtn">我已见证上述同一封存内容的告知过程，确认签署</button>
        </div>
        <div id="wmsg"></div>
        <p class="muted">签名链接一次性、用后即失效；同载荷重复提交只返回首次结果，不产生第二次落款。</p>
      </div></main>`;

    document.getElementById("wbtn").onclick = async () => {
      const box = document.getElementById("wmsg");
      const name = document.getElementById("wname").value.trim();
      if (!name) { toast(box, new Error("请填写见证者姓名")); return; }
      try {
        const attestation = await DeviceAuth.attest("sign", {
          instId: INST, certRole: "witness", role: "witness",
          sessionId, bodyDigest,
        });
        const r = await api("POST", `/api/sessions/${sessionId}/sign`, {
          role: "witness", signer_name: name, token,
          idempotency_key: "witness:" + sessionId + ":" + token, attestation,
        });
        okbox(box, (r.replayed ? "（重复提交，返回首次结果）" : "") +
          (r.result === "completed" ? "签署完成，全部必签角色已齐备，许可已生成。" : "见证签署已记录。"));
        document.getElementById("wbtn").disabled = true;
      } catch (e) {
        toast(box, e);
        if (["cert_rotated", "cert_invalid", "device_quarantined", "challenge_expired"]
            .includes(e.code)) render();
      }
    };
  }
  render();
})();
</script>
</body>
</html>
